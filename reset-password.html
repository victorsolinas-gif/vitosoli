<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vitosoli — Nouveau mot de passe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080f;--surface:#0d0f1c;--surface2:#171728;
  --border:rgba(255,255,255,0.07);--text:#eeeaff;--muted:#6b6d8a;
  --grad:linear-gradient(135deg,#7c5cfc,#e040fb,#00d4ff);
  --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + var(--safe-top));padding-bottom:calc(24px + var(--safe-bottom));min-height:100vh}

.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(100px);opacity:.15}
.orb-a{width:500px;height:500px;top:-150px;right:-100px;background:radial-gradient(circle,#7c5cfc,transparent)}
.orb-b{width:400px;height:400px;bottom:-100px;left:-100px;background:radial-gradient(circle,#e040fb,transparent)}

.card{
  position:relative;z-index:1;width:100%;max-width:400px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:36px 32px;
}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px}
.logo-icon{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.logo-name{font-family:'Syne',sans-serif;font-weight:800;font-size:20px}

h1{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;text-align:center;margin-bottom:8px;
  background:linear-gradient(135deg,#a78bfa,#f472b6,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px;line-height:1.6}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
.field input{
  width:100%;background:var(--surface2);border:1.5px solid var(--border);
  border-radius:10px;padding:12px 14px;color:var(--text);
  font-size:15px;font-family:'Inter',sans-serif;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus{border-color:rgba(124,92,252,.5);box-shadow:0 0 0 3px rgba(124,92,252,.1)}
.field input::placeholder{color:var(--muted)}

.btn{
  width:100%;padding:14px;border-radius:12px;border:none;
  background:var(--grad);color:#fff;font-size:15px;font-weight:600;
  font-family:'Inter',sans-serif;cursor:pointer;
  transition:opacity .2s,transform .15s;
  -webkit-tap-highlight-color:transparent;margin-top:6px;
}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.message{
  margin-top:16px;padding:14px;border-radius:10px;
  font-size:13px;line-height:1.6;text-align:center;display:none;
}
.message.success{display:block;background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.25);color:#00ff88}
.message.error{display:block;background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.25);color:#ff6b6b}

.links{display:flex;justify-content:center;margin-top:20px;font-size:13px}
.links a{color:#a78bfa;text-decoration:none}
.links a:hover{text-decoration:underline}

.spinner{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .6s linear infinite;
  vertical-align:middle;margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="orb orb-a"></div>
<div class="orb orb-b"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">✦</div>
    <span class="logo-name">Vitosoli</span>
  </div>

  <h1>Nouveau mot de passe</h1>
  <p class="subtitle">Choisissez un nouveau mot de passe pour votre compte Vitosoli.</p>

  <form id="resetForm">
    <div class="field">
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" placeholder="8 caractères minimum" required autocomplete="new-password" minlength="8">
    </div>

    <div class="field">
      <label for="passwordConfirm">Confirmer le mot de passe</label>
      <input type="password" id="passwordConfirm" placeholder="Retapez votre mot de passe" required autocomplete="new-password" minlength="8">
    </div>

    <button type="submit" class="btn" id="submitBtn">Réinitialiser mon mot de passe</button>

    <div class="message" id="msgBox"></div>
  </form>

  <div class="links">
    <a href="login.html">← Retour à la connexion</a>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

const form = document.getElementById('resetForm');
const submitBtn = document.getElementById('submitBtn');
const msgBox = document.getElementById('msgBox');

if(!token){
  showMessage('error', '❌ Lien invalide. Merci de refaire une demande de réinitialisation depuis la page de connexion.');
  form.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const password = document.getElementById('password').value;
  const passwordConfirm = document.getElementById('passwordConfirm').value;

  msgBox.className = 'message';
  msgBox.style.display = 'none';

  if(password.length < 8){
    showMessage('error', 'Le mot de passe doit contenir au moins 8 caractères.');
    return;
  }
  if(password !== passwordConfirm){
    showMessage('error', 'Les mots de passe ne correspondent pas.');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> Envoi en cours...';

  try {
    const response = await fetch('https://vitosoli.onrender.com/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password })
    });

    const data = await response.json();

    if(response.ok){
      showMessage('success', '✅ ' + data.message);
      form.style.display = 'none';
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    } else {
      showMessage('error', '❌ ' + (data.error || 'Une erreur est survenue.'));
      submitBtn.disabled = false;
      submitBtn.textContent = 'Réinitialiser mon mot de passe';
    }
  } catch(err){
    showMessage('error', '❌ Erreur de connexion au serveur. Réessayez.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Réinitialiser mon mot de passe';
  }
});

function showMessage(type, text){
  msgBox.className = 'message ' + type;
  msgBox.textContent = text;
  msgBox.style.display = 'block';
}
</script>
</body>
</html>
